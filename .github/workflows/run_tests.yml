name: UI Smoke Tests

on:
  push:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest-playwright

    - name: Ensure browsers are installed
      run: playwright install chromium

    - name: Install Juice Shop
      run: |
        git clone --depth 1 https://github.com/juice-shop/juice-shop.git
        cd juice-shop && npm install --include-workspace-root

    - name: Start Juice Shop
      run: docker run -d -p 3000:3000 bkimminich/juice-shop

    - name: Wait for app to be ready
      run: |
        timeout 60 bash -c 'until curl -s http://localhost:3000 > /dev/null; do sleep 2; done'

    - name: Run tests in CI
      run: pytest tests/ -v
