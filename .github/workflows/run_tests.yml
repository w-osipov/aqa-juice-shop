name: UI Smoke Tests

on:
  push:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest-playwright

    - name: Ensure browsers are installed
      run: playwright install chromium

    - name: Install Juice Shop
      run: |
        git clone --depth 1 https://github.com/juice-shop/juice-shop.git
        cd juice-shop && npm install --include-workspace-root

    - name: Start Juice Shop
      run: |
        docker rm -f juice-shop 2>/dev/null || true
        docker run -d --name juice-shop -p 3000:3000 bkimminich/juice-shop

    - name: Wait for Juice Shop to be ready
      run: |
        for i in $(seq 1 60); do
          if curl -fsS -o /dev/null http://localhost:3000/; then
            echo "Juice Shop is ready"
            exit 0
          fi
          sleep 2
        done
        echo "--- Container logs ---"
        docker logs juice-shop || true
        exit 1


    - name: Run tests in CI
      run: pytest tests/ -v --screenshot only-on-failure --output test-results

    - name: Upload failure screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: test-results
