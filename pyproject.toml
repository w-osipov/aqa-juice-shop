[project]
name = "aqa_juice_shop"
version = "0.1.0"
readme = "README.md"

requires-python = ">=3.12"
dependencies = [
    "pytest>=8.0.0",
    "playwright>=1.40.0",
    "pytest-playwright>=0.5.0",
]

[project.scripts]
aqa_juice_shop = "aqa_juice_shop:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"